name: "Publish Python distribution to PyPI"
# Uses:
# https://github.com/actions/checkout : v6.0.2 de0fac2e4500dabe0009e67214ff5f5447ce83dd
# https://github.com/actions/download-artifact : v8.0.1 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
# https://github.com/actions/upload-artifact : v7.0.0 bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
# https://github.com/pypa/gh-action-pypi-publish : v1.13.0 ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
# https://github.com/astral-sh/setup-uv : v7.5.0 e06108dd0aef18192324c70427afc47652e63a82

on:
  release:
    types: [published]

jobs:
  build:
    name: "Build package"
    runs-on: "ubuntu-latest"
    outputs:
      artifact-id: "${{ steps.upload-artifact.outputs.artifact-id }}"

    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false

      - name: "Install the latest version of uv"
        uses: "astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82"
        with:
          version: "latest"
          enable-cache: true

      - name: "Build the package"
        run: "uvx nox --session build"

      - name: "Store the distribution packages"
        id: "upload-artifact"
        uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f"
        with:
          path: "./dist"

  publish-to-pypi:
    name: "Publish Python Distribution to PyPI"
    needs: ["build"]
    runs-on: "ubuntu-latest"
    environment:
      name: "pypi"
      url: "https://pypi.org/project/trackbear-api/"
    permissions:
      id-token: "write"

    steps:
      - name: "Download all the dists"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
        with:
          artifact-ids: "${{ needs.build.outputs.artifact-id }}"
          path: "./dist"
          merge-multiple: true

      - name: "Publish distribution to PyPI"
        uses: "pypa/gh-action-pypi-publis: v1.13.0 ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e"
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          verbose: true
